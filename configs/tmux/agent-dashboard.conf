# Single title owner: Dotbar consumes this slot for current/inactive windows.
# The literal workmux reference prevents its hooks from replacing our formats.
# Stopped turns remain visible while their launch identity is valid. Only
# working/waiting evidence uses the conservative 15-minute silence timeout.
set -g @tmux-dotbar-window-status-format ' #{?#{&&:#{@dotfiles-agent},#{&&:#{>=:#{t/d:@dotfiles-agent-ts},0},#{||:#{==:#{@dotfiles-agent-state},done},#{<:#{t/d:@dotfiles-agent-ts},900}}}},#{E:@dotfiles-agent},#W}#{?@workmux_status,,} '

# Native one-second format monitors; no polling daemon or status #() jobs.
# The installer checks conflicts and Ghostty's companion forwarding first.
# Legacy Ghostty keeps n as new-window; display monitoring still works.
run-shell 'python3 -B "@RELEASE@/tmux/agent-dashboard.py" install --socket #{q:socket_path}'
