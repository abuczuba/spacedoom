# Single title owner: Dotbar consumes this slot for current/inactive windows.
# The literal workmux reference prevents its hooks from replacing our formats.
# Stopped turns remain visible while their launch identity is valid. Only
# working/waiting evidence uses the conservative 15-minute silence timeout.
set -g @tmux-dotbar-window-status-format '#{?#{&&:#{window_active},#{==:#{@dotfiles-agent-state},working}},#[nounderscore#,us=default],} #{?#{&&:#{@dotfiles-agent},#{&&:#{>=:#{t/d:@dotfiles-agent-ts},0},#{||:#{==:#{@dotfiles-agent-state},done},#{<:#{t/d:@dotfiles-agent-ts},900}}}},#{E:@dotfiles-agent},#W}#{?@workmux_status,,} '

# Startup activation follows theme/navigation setup in tmux.conf. At server
# creation there may be no session yet; bootstrap waits for session-created.
