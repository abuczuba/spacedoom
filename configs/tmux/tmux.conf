# Adapted from original 2026-06-24 ~/.tmux.conf; old-Mac paths corrected.
# Keep Fish inside tmux, without changing the account's default login shell.
set -g default-shell /opt/homebrew/bin/fish
# remap prefix from 'C-b' to 'C-f'
unbind C-b
set-option -g prefix C-f
bind-key C-f send-prefix

bind C-w display-popup -h 50 -w 200 -E "workmux dashboard"

bind-key r source-file ~/.tmux.conf \; display-message "~/.tmux.conf reloaded"

set -g base-index 1           # Window numbers start at 1
setw -g pane-base-index 1     # Pane numbers start at 1
setw -g mode-keys vi          # Vi bindings in copy mode
set -s escape-time 0          # No delay after Esc
set -g detach-on-destroy off  # Stay in tmux when session closes
set -g renumber-windows on    # No gaps after closing windows
set -g mouse on

# split panes using | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# switch panes using Alt + vim movement keys without prefix
bind C-h select-pane -L
bind C-l select-pane -R
bind C-k select-pane -U
bind C-j select-pane -D

# Toggle to the most recent workmux agent
bind Tab run-shell "workmux last-agent"

# don't do anything when a 'bell' rings
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

set -g pane-border-style 'fg=black'
set -g pane-active-border-style 'fg=yellow'


##### Plugins

set -g @plugin 'tmux-plugins/tpm'

# colorscheme
set -g @plugin 'rose-pine/tmux'
set -g @rose_pine_variant 'main'

# statusbar
set -g @plugin 'vaaleyard/tmux-dotbar'
set -g @tmux-dotbar-fg "#e0def4"
set -g @tmux-dotbar-bg "#1f1d2e"
set -g @tmux-dotbar-fg-current "#f6c177"
set -g @tmux-dotbar-fg-session "#c4a7e7"
set -g @tmux-dotbar-fg-prefix "#eb6f92"

set -g @tmux-dotbar-right true
set -g @tmux-dotbar-position top
set -g @tmux-dotbar-justify "absolute-centre"

# Repository candidate only; loaded before Dotbar so it remains the title owner.
set -g @dotfiles-dashboard-enabled on
source-file "@RELEASE@/tmux/agent-dashboard.conf"

run '$HOME/.tmux/plugins/tmux-dotbar/dotbar.tmux'
run '$HOME/.tmux/plugins/tpm/tpm'

# >>> czuba-navigation-v1 >>>
source-file "@RELEASE@/tmux/czuba-navigation.conf"
# <<< czuba-navigation-v1 <<<

set -g renumber-windows on

set -g renumber-windows on

# Register before the first session; activate only after theme/navigation exist.
run-shell 'python3 -B "@RELEASE@/tmux/agent-dashboard.py" bootstrap --socket #{q:socket_path}'
