# Czuba Navigation v1 — tmux 3.8
# Loaded after existing tmux plugins by ~/.tmux.conf.
# Prefix remains Ctrl-F as a fallback. Ghostty sends prefix + key directly.

# Correct the original binding error: unmodified h/j/k/l AFTER prefix,
# not C-h/C-j/C-k/C-l, which required an additional Ctrl key.
bind-key h if-shell -F '#{pane_at_left}' '' 'select-pane -L'
bind-key j if-shell -F '#{pane_at_bottom}' '' 'select-pane -D'
bind-key k if-shell -F '#{pane_at_top}' '' 'select-pane -U'
bind-key l if-shell -F '#{pane_at_right}' '' 'select-pane -R'

# Geometry. Pane inherits the current directory.
bind-key v split-window -h -c '#{pane_current_path}'
bind-key s split-window -v -c '#{pane_current_path}'
bind-key n new-window -c '#{pane_current_path}'
bind-key z resize-pane -Z

# Responsive workmux dashboard: works on MacBook-sized windows.
bind-key w display-popup -E -w 90% -h 80% 'workmux dashboard'
bind-key C-w display-popup -E -w 90% -h 80% 'workmux dashboard'

# Protect against accidental destruction of running editor/agent processes.
bind-key x confirm-before -p 'Close current pane? (y/n)' 'kill-pane'

# Window numbers are 1-based in the existing ~/.tmux.conf.
bind-key 1 select-window -t :1
bind-key 2 select-window -t :2
bind-key 3 select-window -t :3
bind-key 4 select-window -t :4
bind-key 5 select-window -t :5
bind-key 6 select-window -t :6
bind-key 7 select-window -t :7
bind-key 8 select-window -t :8
bind-key 9 select-window -t :9
bind-key Y run-shell "tmux capture-pane -p -J -S - -t #{pane_id} | pbcopy"

bind-key C-h if-shell -F '#{pane_at_left}' '' 'select-pane -L'
bind-key C-j if-shell -F '#{pane_at_bottom}' '' 'select-pane -D'
bind-key C-k if-shell -F '#{pane_at_top}' '' 'select-pane -U'
bind-key C-l if-shell -F '#{pane_at_right}' '' 'select-pane -R'

# Cheatsheet; retain the former prefix+? key list on prefix+Q.
bind-key Q list-keys -N
bind-key ? display-popup -E -w 95% -h 85% -b rounded -s 'fg=#20242b,bg=#f3e8d2' -S 'fg=#264f78,bg=#f3e8d2' -T ' Shortcuts | 1-8 sections | / search | q close ' 'sh "@RELEASE@/tmux/show-shortcuts.sh"'

# Reorder adjacent windows; keep focus and stop at the first/last window.
# L and </> retain tmux's default client/menu bindings. Capture stable IDs before
# the swap; a marked pane must not change the source or the selected window.
bind-key M-h if-shell -F '#{window_start_flag}' '' {
    run-shell -C "swap-window -d -s '#{session_id}:#{window_id}' -t '#{session_id}:-' ; select-window -t '#{session_id}:#{window_id}' ; move-window -r -t '#{session_id}:'"
}
bind-key M-l if-shell -F '#{window_end_flag}' '' {
    run-shell -C "swap-window -d -s '#{session_id}:#{window_id}' -t '#{session_id}:+' ; select-window -t '#{session_id}:#{window_id}' ; move-window -r -t '#{session_id}:'"
}
